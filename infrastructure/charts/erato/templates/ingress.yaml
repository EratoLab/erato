{{- if and .Values.ingress.enabled .Values.gatewayApi.enabled -}}
{{- fail "ingress.enabled and gatewayApi.enabled cannot both be true; choose one exposure method" -}}
{{- end -}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | squote }}
    {{- end }}
    {{- if eq (.Values.deployment.ingressClassName | default .Values.ingress.className) "tailscale" }}
    tailscale.com/tags: {{ .Values.deployment.tailscaleTags | default "tag:k8s-observability" | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.deployment.ingressClassName | default .Values.ingress.className }}
  tls:
    {{- if or .Values.ingress.tls.enabled .Values.deployment.tlsSecretName (and (eq (.Values.deployment.ingressClassName | default .Values.ingress.className) "tailscale") .Values.deployment.ingressTlsHost) }}
    - hosts:
        - {{ .Values.deployment.ingressTlsHost | default .Values.deployment.appHost | default .Values.ingress.host | quote }}
      {{- if or .Values.deployment.tlsSecretName (ne (.Values.deployment.ingressClassName | default .Values.ingress.className) "tailscale") }}
      secretName: {{ .Values.deployment.tlsSecretName | default .Values.ingress.tls.secretName }}
      {{- end }}
    {{- end }}
  rules:
    {{- if ne (.Values.deployment.ingressClassName | default .Values.ingress.className) "tailscale" }}
    - host: {{ .Values.deployment.appHost | default .Values.ingress.host | quote }}
    {{- else }}
    -
    {{- end }}
      http:
        paths:
          {{- with .Values.ingress.extraPaths }}
          {{- tpl (. | toYaml | nindent 10) $ }}
          {{- end }}
          {{- if and .Values.msTeamsBot.directRoute.enabled .Values.oauth2Proxy.enabled }}
          # Teams bot webhook: authenticated by the backend, not oauth2-proxy
          - path: /api/integrations/ms_teams/messages
            pathType: Exact
            backend:
              service:
                name: {{ printf "%s-erato-app" .Release.Name }}
                port:
                  number: 3130
          {{- end }}
          # Main application routes through oauth2-proxy (if enabled)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "erato.exposureBackendName" . }}
                port:
                  number: {{ include "erato.exposureBackendPort" . }}
{{- end }}
