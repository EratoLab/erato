{{- if .Values.backend.loadBalancer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-erato-backend-load-balancer
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: erato-backend-load-balancer
spec:
  type: {{ .Values.backend.loadBalancer.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.loadBalancer.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: erato-backend-load-balancer
{{- end }}
