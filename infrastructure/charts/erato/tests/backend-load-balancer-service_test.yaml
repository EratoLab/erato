# yaml-language-server: $schema=../tests_schema/helm-testsuite.json
suite: test intermediate backend load balancer service
minimumVersion: 1.0.1
templates:
  - backend-load-balancer-service.yaml
tests:
  - it: should not render when disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should expose the intermediate load balancer when enabled
    set:
      backend.loadBalancer.enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-erato-backend-load-balancer
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: http
