# yaml-language-server: $schema=../tests_schema/helm-testsuite.json
suite: test backend deployment
minimumVersion: 1.0.1
templates:
  - backend-configmaps.yaml
  - backend-metrics-configmap.yaml
  - backend-deployment.yaml
chart:
  appVersion: 0.2.99
  version: 0.2.99
tests:
  - it: should render a deployment with default values
    template: backend-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-erato-app
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: erato-app
      - equal:
          path: spec.template.spec.containers[0].name
          value: erato-backend
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.eratolabs.com/erato/app:0.2.99
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.eratolabs.com/erato/app-sqitch-migrator:0.2.99
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3130

  - it: should honor namespaceOverride
    set:
      namespaceOverride: custom-namespace
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace

  - it: should set custom replica count
    set:
      backend.replicaCount: 3
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should set backend deployment strategy when configured
    set:
      backend.deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: should use custom image repository and tag
    set:
      backend.image.repository: my-registry/erato
      backend.image.tag: v1.2.3
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: my-registry/erato:v1.2.3
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.eratolabs.com/erato/app-sqitch-migrator:v1.2.3

  - it: should use custom migrator image repository and tag
    set:
      backend.image.tag: v1.2.3
      backend.migrations.image.repository: my-registry/erato-migrator
      backend.migrations.image.tag: v4.5.6
      backend.migrations.image.pullPolicy: Always
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: my-registry/erato-migrator:v4.5.6
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: Always

  - it: should set environment variables correctly
    set:
      global.environment: staging
      backend.extraEnvVars:
        - name: CUSTOM_VAR
          value: test-value
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENVIRONMENT
            value: staging
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CUSTOM_VAR
            value: test-value

  - it: should pass pod and node identity through the Downward API
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ERATO_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ERATO_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName

  - it: should set default logging environment variables
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: warn
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOGGING__FORMAT
            value: json

  - it: should set custom RUST_LOG when backend.rustLog is configured
    set:
      backend.rustLog: info,erato=debug
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG
            value: info,erato=debug

  - it: should omit RUST_LOG when backend.rustLog is empty
    set:
      backend.rustLog: ""
    template: backend-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RUST_LOG

  - it: should omit JSON logging format when backend.logJson is false
    set:
      backend.logJson: false
    template: backend-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOGGING__FORMAT

  - it: should add envFrom when extraEnvVarsCM is set
    set:
      backend.extraEnvVarsCM: erato-config-cm
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: erato-config-cm

  - it: should add envFrom when extraEnvVarsSecret is set
    set:
      backend.extraEnvVarsSecret: erato-secret
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: erato-secret

  - it: should mount config file when configFile is set
    set:
      backend.configFile.secretName: erato-config
      backend.configFile.secretKey: erato.toml
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: erato-config
            mountPath: /app/erato.toml
            subPath: erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: erato-config
            secret:
              secretName: erato-config
              items:
                - key: erato.toml
                  path: erato.toml

  - it: should set resource limits and requests
    set:
      backend.resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: should have init container for migrations
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: run-migrations
      - equal:
          path: spec.template.spec.initContainers[0].command[0]
          value: /bin/bash
      - contains:
          path: spec.template.spec.initContainers[0].args
          content: "-c"

  - it: should include liveness and readiness probes
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http

  - it: should not expose metrics port or env vars by default
    template: backend-deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ERATO__INTEGRATIONS__PROMETHEUS__ENABLED

  - it: should expose metrics port and mount metrics auto config when metrics is enabled
    set:
      backend.metrics.enabled: true
      backend.metrics.host: 0.0.0.0
      backend.metrics.port: 3131
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 3131
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: erato-metrics-config
            mountPath: /app/metrics.auto.erato.toml
            subPath: metrics.auto.erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: erato-metrics-config
            configMap:
              name: RELEASE-NAME-backend-metrics-config
              items:
                - key: metrics.auto.erato.toml
                  path: metrics.auto.erato.toml

  - it: should support extraVolumes and extraVolumeMounts
    set:
      backend.extraVolumes:
        - name: test-volume
          emptyDir: {}
        - name: secret-volume
          secret:
            secretName: my-secret
      backend.extraVolumeMounts:
        - name: test-volume
          mountPath: /tmp/test
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: test-volume
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: secret-volume
            secret:
              secretName: my-secret
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: test-volume
            mountPath: /tmp/test
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: secret-volume
            mountPath: /etc/secrets
            readOnly: true

  - it: should support extraInitContainers for preparing extra volumes
    set:
      backend.extraInitContainers:
        - name: copy-component-kit-trilux
          image: registry.example.com/component-kit-trilux:v1
          command:
            - /bin/sh
            - -c
          args:
            - cp -a /app/component-kits/trilux/. /component-kit/
          volumeMounts:
            - name: component-kit-trilux
              mountPath: /component-kit
      backend.extraVolumes:
        - name: component-kit-trilux
          emptyDir: {}
      backend.extraVolumeMounts:
        - name: component-kit-trilux
          mountPath: /app/component-kits/trilux
          readOnly: true
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: run-migrations
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: copy-component-kit-trilux
            image: registry.example.com/component-kit-trilux:v1
            command:
              - /bin/sh
              - -c
            args:
              - cp -a /app/component-kits/trilux/. /component-kit/
            volumeMounts:
              - name: component-kit-trilux
                mountPath: /component-kit
      - contains:
          path: spec.template.spec.volumes
          content:
            name: component-kit-trilux
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: component-kit-trilux
            mountPath: /app/component-kits/trilux
            readOnly: true

  - it: should support extraVolumeMounts without extraVolumes
    set:
      backend.extraVolumeMounts:
        - name: existing-volume
          mountPath: /mnt/existing
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: existing-volume
            mountPath: /mnt/existing

  - it: should support extraVolumes without extraVolumeMounts
    set:
      backend.extraVolumes:
        - name: unused-volume
          configMap:
            name: my-config
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: unused-volume
            configMap:
              name: my-config

  - it: should not include volumes or volumeMounts when none are configured
    set:
      backend.configFile.secretName: ""
      backend.configFile.secretKey: ""
      backend.extraVolumes: []
      backend.extraVolumeMounts: []
    template: backend-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts

  - it: should work with both configFile and extraVolumes/extraVolumeMounts
    set:
      backend.configFile.secretName: "erato-config-secret"
      backend.configFile.secretKey: "erato.toml"
      backend.extraVolumes:
        - name: additional-volume
          emptyDir: {}
      backend.extraVolumeMounts:
        - name: additional-volume
          mountPath: /tmp/additional
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: erato-config
            secret:
              secretName: erato-config-secret
              items:
                - key: erato.toml
                  path: erato.toml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: additional-volume
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: erato-config
            mountPath: /app/erato.toml
            subPath: erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: additional-volume
            mountPath: /tmp/additional

  - it: should mount config file from configMap
    set:
      backend.configFile.configMapName: erato-config-cm
      backend.configFile.configMapKey: erato.toml
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: erato-config
            mountPath: /app/erato.toml
            subPath: erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: erato-config
            configMap:
              name: erato-config-cm
              items:
                - key: erato.toml
                  path: erato.toml

  - it: should mount config file from inline content
    set:
      backend.configFile.inlineContent: |
        [database]
        host = "localhost"
        port = 5432
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: erato-config
            mountPath: /app/erato.toml
            subPath: erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: erato-config
            configMap:
              name: RELEASE-NAME-erato-inline-config
              items:
                - key: erato.toml
                  path: erato.toml

  - it: should mount extra config files from secrets
    set:
      backend.extraConfigFiles:
        - name: mcp-config
          secretName: mcp-secret
          secretKey: mcp.toml
        - name: additional-config
          secretName: additional-secret
          secretKey: additional.toml
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config-mcp-config
            mountPath: /app/mcp-config.auto.erato.toml
            subPath: mcp-config.auto.erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config-additional-config
            mountPath: /app/additional-config.auto.erato.toml
            subPath: additional-config.auto.erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-config-mcp-config
            secret:
              secretName: mcp-secret
              items:
                - key: mcp.toml
                  path: mcp-config.auto.erato.toml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-config-additional-config
            secret:
              secretName: additional-secret
              items:
                - key: additional.toml
                  path: additional-config.auto.erato.toml

  - it: should mount extra config files from configMaps
    set:
      backend.extraConfigFiles:
        - name: mcp-config
          configMapName: mcp-config-cm
          configMapKey: mcp.toml
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config-mcp-config
            mountPath: /app/mcp-config.auto.erato.toml
            subPath: mcp-config.auto.erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-config-mcp-config
            configMap:
              name: mcp-config-cm
              items:
                - key: mcp.toml
                  path: mcp-config.auto.erato.toml

  - it: should mount extra config files from inline content
    set:
      backend.extraConfigFiles:
        - name: mcp-config
          inlineContent: |
            [mcp_servers.example]
            command = "example-server"
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config-mcp-config
            mountPath: /app/mcp-config.auto.erato.toml
            subPath: mcp-config.auto.erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-config-mcp-config
            configMap:
              name: RELEASE-NAME-extra-config-mcp-config-inline
              items:
                - key: mcp-config.toml
                  path: mcp-config.auto.erato.toml

  - it: should handle mixed config file sources
    set:
      backend.configFile.inlineContent: |
        [database]
        host = "localhost"
      backend.extraConfigFiles:
        - name: mcp-config
          secretName: mcp-secret
          secretKey: mcp.toml
        - name: additional-config
          configMapName: additional-cm
          configMapKey: additional.toml
    template: backend-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: erato-config
            mountPath: /app/erato.toml
            subPath: erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config-mcp-config
            mountPath: /app/mcp-config.auto.erato.toml
            subPath: mcp-config.auto.erato.toml
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config-additional-config
            mountPath: /app/additional-config.auto.erato.toml
            subPath: additional-config.auto.erato.toml
            readOnly: true

  # Annotation tests
  - it: should not include deployment annotations when none are set
    template: backend-deployment.yaml
    asserts:
      - notExists:
          path: metadata.annotations

  - it: should include deployment annotations when backend.deploymentAnnotations is set
    set:
      backend.deploymentAnnotations:
        deployment.kubernetes.io/revision: "1"
        custom/annotation: "value"
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: metadata.annotations["deployment.kubernetes.io/revision"]
          value: "1"
      - equal:
          path: metadata.annotations["custom/annotation"]
          value: "value"

  - it: should include deployment annotations when commonAnnotations is set
    set:
      commonAnnotations:
        common/annotation: "common-value"
        environment: "test"
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: metadata.annotations["common/annotation"]
          value: "common-value"
      - equal:
          path: metadata.annotations["environment"]
          value: "test"

  - it: should merge deployment annotations with commonAnnotations
    set:
      commonAnnotations:
        common/annotation: "common-value"
        environment: "test"
      backend.deploymentAnnotations:
        deployment.kubernetes.io/revision: "1"
        backend/specific: "backend-value"
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: metadata.annotations["common/annotation"]
          value: "common-value"
      - equal:
          path: metadata.annotations["environment"]
          value: "test"
      - equal:
          path: metadata.annotations["deployment.kubernetes.io/revision"]
          value: "1"
      - equal:
          path: metadata.annotations["backend/specific"]
          value: "backend-value"

  - it: should override commonAnnotations with backend.deploymentAnnotations when keys conflict
    set:
      commonAnnotations:
        environment: "common-environment"
        common/annotation: "common-value"
      backend.deploymentAnnotations:
        environment: "backend-environment"
        backend/specific: "backend-value"
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: metadata.annotations["environment"]
          value: "backend-environment"
      - equal:
          path: metadata.annotations["common/annotation"]
          value: "common-value"
      - equal:
          path: metadata.annotations["backend/specific"]
          value: "backend-value"

  - it: should include config checksums without custom pod annotations
    template: backend-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: '^[a-f0-9]{64}$'
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/metrics-config"]
          pattern: '^[a-f0-9]{64}$'

  - it: should include pod annotations when backend.podAnnotations is set
    set:
      backend.podAnnotations:
        pod/annotation: "pod-value"
        prometheus.io/scrape: "true"
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["pod/annotation"]
          value: "pod-value"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: should include pod annotations when commonAnnotations is set
    set:
      commonAnnotations:
        common/annotation: "common-value"
        prometheus.io/port: "8080"
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["common/annotation"]
          value: "common-value"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "8080"

  - it: should merge pod annotations with commonAnnotations
    set:
      commonAnnotations:
        common/annotation: "common-value"
        prometheus.io/port: "8080"
      backend.podAnnotations:
        pod/annotation: "pod-value"
        prometheus.io/scrape: "true"
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["common/annotation"]
          value: "common-value"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "8080"
      - equal:
          path: spec.template.metadata.annotations["pod/annotation"]
          value: "pod-value"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: should override commonAnnotations with backend.podAnnotations when keys conflict
    set:
      commonAnnotations:
        prometheus.io/scrape: "false"
        common/annotation: "common-value"
      backend.podAnnotations:
        prometheus.io/scrape: "true"
        pod/specific: "pod-value"
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["common/annotation"]
          value: "common-value"
      - equal:
          path: spec.template.metadata.annotations["pod/specific"]
          value: "pod-value"

  - it: should render annotations with template values
    set:
      backend.deploymentAnnotations:
        app.version: "{{ .Chart.AppVersion }}"
        release.name: "{{ .Release.Name }}"
      backend.podAnnotations:
        chart.version: "{{ .Chart.Version }}"
        namespace: "{{ .Release.Namespace }}"
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: metadata.annotations["app.version"]
          value: "0.2.99"
      - equal:
          path: metadata.annotations["release.name"]
          value: "RELEASE-NAME"
      - equal:
          path: spec.template.metadata.annotations["chart.version"]
          value: "0.2.99"
      - equal:
          path: spec.template.metadata.annotations["namespace"]
          value: "NAMESPACE"

  - it: should preserve generated checksums when custom annotations use the same key
    template: backend-deployment.yaml
    set:
      commonAnnotations:
        checksum/config: common-override
      backend.podAnnotations:
        checksum/config: pod-override
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: '^[a-f0-9]{64}$'
