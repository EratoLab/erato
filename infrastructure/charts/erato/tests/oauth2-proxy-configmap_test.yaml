# yaml-language-server: $schema=../tests_schema/helm-testsuite.json
suite: test oauth2-proxy configmap
minimumVersion: 1.0.1
templates:
  - oauth2-proxy-configmap.yaml
tests:
  - it: should render configmap when oauth2Proxy is enabled
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-oauth2-proxy-config-file
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotEmpty:
          path: data["oauth2-proxy.cfg"]

  - it: should not render when oauth2Proxy is disabled
    set:
      oauth2Proxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should configure the chart-managed Redis service for session storage
    asserts:
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'session_store_type = "redis"'
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'redis_connection_url = "redis://RELEASE-NAME-oauth2-proxy-redis:6379"'

  - it: should include proper labels
    asserts:
      - isNotEmpty:
          path: metadata.labels
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: erato
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should include custom config content
    set:
      oauth2Proxy.config: |
        http_address = "0.0.0.0:4180"
        upstreams = ["http://backend:8080"]
        email_domains = ["example.com"]
    asserts:
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'http_address = "0.0.0.0:4180"'
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'upstreams = \["http://backend:8080"\]'
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'email_domains = \["example.com"\]'

  - it: should preserve external Redis configuration when embedded Redis is disabled
    set:
      oauth2Proxy.redis.enabled: false
      oauth2Proxy.config: |
        session_store_type = "redis"
        redis_connection_url = "redis://external-redis:6379"
    asserts:
      - matchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'redis_connection_url = "redis://external-redis:6379"'
      - notMatchRegex:
          path: data["oauth2-proxy.cfg"]
          pattern: 'redis_connection_url = "redis://RELEASE-NAME-oauth2-proxy-redis:6379"'

  - it: should include custom labels when specified
    set:
      commonLabels:
        custom-label: custom-value
        environment: test
    asserts:
      - equal:
          path: metadata.labels["custom-label"]
          value: custom-value
      - equal:
          path: metadata.labels["environment"]
          value: test
