# Many models test scenario - provides a large model list for selector testing
# This scenario is used to test model selector behavior with many models

[guardrails.prompt_patterns.ignore_previous_instructions]
type = "fixed"
pattern = "ignore all previous instructions"
language = "en"
tags = ["input", "prompt_injection"]

[chat_providers.summary]
summary_chat_provider_id = "mock-llm-openai"

[chat_providers.providers.mock-llm-openai]
provider_kind = "openai"
model_name = "placeholder"
model_display_name = "Mock-LLM"
base_url = "http://erato-local-mock-llm-server:44320/base-openai/v1/placeholder"

[chat_providers.providers.mock-llm-openai.model_capabilities]
supports_audio_input = true

[chat_providers.providers.mock-llm-openai.hallucination_suppression]
enabled = true
whitespace_delta_threshold = 3

[chat_providers.providers.mock-llm-openai.guardrails.filter_input_prompt_injection]
enabled = true
filter_pattern_ids = ["ignore_previous_instructions"]
filter_pattern_tags = []

[audio_transcription]
enabled = true
chat_provider_id = "mock-llm-openai"
max_recording_duration_seconds = 1200
chunk_duration_seconds = 30
max_attempts = 3
initial_backoff_ms = 10
max_backoff_ms = 50

[audio_dictation]
enabled = true
chat_provider_id = "mock-llm-openai"
max_recording_duration_seconds = 1200
chunk_duration_seconds = 30
max_attempts = 3
initial_backoff_ms = 10
max_backoff_ms = 50

[audio_conversational]
enabled = true
chat_provider_id = "mock-llm-openai"
max_recording_duration_seconds = 1200
chunk_duration_seconds = 30
max_attempts = 3
initial_backoff_ms = 10
max_backoff_ms = 50

[mcp_servers_global]
max_session_idle_seconds = 3600

[mcp_servers_global.approval]
enabled = true
preset = "restrictive"
allow_always = true

[mcp_servers.mock_mcp_approval]
transport_type = "streamable_http"
url = "http://erato-local-mock-mcp-server:44321/mcp/approval-policy"

[mcp_servers.mock_mcp_progress]
transport_type = "streamable_http"
url = "http://erato-local-mock-mcp-server:44321/mcp/progress"

[mcp_servers.mock_mcp_image_generation]
transport_type = "streamable_http"
url = "http://erato-local-mock-mcp-server:44321/mcp/image-generation"

[mcp_servers.mock_mcp_auth_none]
transport_type = "streamable_http"
url = "http://erato-local-mock-mcp-server:44321/mcp/auth-none"

[mcp_servers.mock_mcp_auth_none.authentication]
mode = "none"

[mcp_servers.mock_mcp_auth_forwarded_access]
transport_type = "streamable_http"
url = "http://erato-local-mock-mcp-server:44321/mcp/auth-forwarded-access"

[mcp_servers.mock_mcp_auth_forwarded_access.authentication]
mode = "forwarded"

[mcp_servers.mock_mcp_auth_forwarded_access.authentication.forwarded]
credential = "access_token"

[mcp_servers.mock_mcp_auth_forwarded_oidc]
transport_type = "streamable_http"
url = "http://erato-local-mock-mcp-server:44321/mcp/auth-forwarded-oidc"

[mcp_servers.mock_mcp_auth_forwarded_oidc.authentication]
mode = "forwarded"

[mcp_servers.mock_mcp_auth_forwarded_oidc.authentication.forwarded]
credential = "oidc_id_token"

[mcp_servers.mock_mcp_auth_fixed]
transport_type = "streamable_http"
url = "http://erato-local-mock-mcp-server:44321/mcp/auth-fixed"

[mcp_servers.mock_mcp_auth_fixed.authentication]
mode = "fixed"

[mcp_servers.mock_mcp_auth_fixed.authentication.fixed]
api_key = "fixed-api-key-secret"

[mcp_servers.mock_mcp_unavailable_500]
transport_type = "streamable_http"
url = "http://erato-local-mock-mcp-server:44321/mcp/list-tools-500"

[mcp_server_permissions.rules.allow_mock_mcp_progress_for_all]
rule_type = "allow-all"
mcp_server_ids = ["mock_mcp_progress"]

[mcp_server_permissions.rules.allow_mock_mcp_image_generation_for_all]
rule_type = "allow-all"
mcp_server_ids = ["mock_mcp_image_generation"]

[mcp_server_permissions.rules.allow_mock_mcp_approval_for_all]
rule_type = "allow-all"
mcp_server_ids = ["mock_mcp_approval"]

[mcp_server_permissions.rules.allow_mock_mcp_auth_none_for_group]
rule_type = "allow-for-group-members"
mcp_server_ids = ["mock_mcp_auth_none"]
groups = ["mcp-auth-none"]

[mcp_server_permissions.rules.allow_mock_mcp_auth_fixed_for_group]
rule_type = "allow-for-group-members"
mcp_server_ids = ["mock_mcp_auth_fixed"]
groups = ["mcp-auth-fixed"]

[mcp_server_permissions.rules.allow_mock_mcp_auth_forwarded_access_for_group]
rule_type = "allow-for-group-members"
mcp_server_ids = ["mock_mcp_auth_forwarded_access"]
groups = ["mcp-auth-forwarded-access"]

[mcp_server_permissions.rules.allow_mock_mcp_auth_forwarded_oidc_for_group]
rule_type = "allow-for-group-members"
mcp_server_ids = ["mock_mcp_auth_forwarded_oidc"]
groups = ["mcp-auth-forwarded-oidc"]

[mcp_server_permissions.rules.allow_mock_mcp_unavailable_500_for_group]
rule_type = "allow-for-group-members"
mcp_server_ids = ["mock_mcp_unavailable_500"]
groups = ["mcp-unavailable-resilience"]

[chat_sharing]
enabled = true

[frontend.additional_environment]
K3D_TEST_SCENARIO = "many-models"

# Model-planned delegated tasks, for dynamic-tasks.many-models.spec.ts. Off by
# default everywhere else; on here so the task route has a scenario to run in.
# Enabling it is not enough on its own: the planning facet below is what
# actually offers `erato/delegate_task`.
[delegation.tasks]
enabled = true

# Restated in full rather than adding `plan` to the base `erato.toml`: that file
# reaches EVERY scenario, and a second chip there would change what `facets[0]`
# means for the specs that read the roster. Restating also makes this block
# correct whether the loader deep-merges the base `[facets]` table or replaces
# it outright.
#
# `web_search` stays FIRST in priority_order on purpose: /me/facets emits
# priority_order before the remainder (sorted), and
# assistant-facets.many-models.spec.ts takes `facets[0]`. Alphabetically `plan`
# would win that slot.
[facets]
priority_order = ["web_search", "plan"]
default_selected_facets = []

[facets.facets.web_search]
display_name = "Web search"
icon = "iconoir-globe"
tool_call_allowlist = ["web-search-mcp/*", "web-access-mcp/*"]
additional_system_prompt = "Please execute one or multiple web searches to answer the user's question."

# Selecting this facet is what offers `erato/delegate_task`. The reserved
# pattern is deliberately paired with a real MCP pattern: an allowlist naming
# only reserved tools narrows the turn's MCP tool set to nothing, which would
# leave the parent with no tools at all.
#
# `mock_mcp_progress` is the pairing because its permission rule is `allow-all`
# (see allow_mock_mcp_progress_for_all above); pairing with a group-gated server
# would need its own rule, and the first rule of a kind hides every server not
# listed.
[facets.facets.plan]
display_name = "Plan & delegate"
icon = "iconoir-strategy"
tool_call_allowlist = ["erato/delegate_task", "mock_mcp_progress/*"]
disable_facet_prompt_template = true
