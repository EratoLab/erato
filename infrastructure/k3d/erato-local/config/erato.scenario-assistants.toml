# Assistants test scenario - enables assistant functionality

[assistants]
enabled = true

# Migrated off the deprecated `[assistants.delegation]` alias: it may not be
# combined with `[delegation]`, and the task route below needs
# `[delegation.tasks]`. Combining the two is a hard panic, not a warning.
[delegation]
run_timeout_seconds = 120

[delegation.assistants]
enabled = true

# Model-planned delegated tasks, for dynamic-tasks.assistants.spec.ts. This is
# the scenario where the task route can be driven deterministically, for exactly
# the reason given above `[chat_providers]`: a child run carries no provider of
# its own, and here the only provider is the mock. In many-models the default is
# a live model, which answers the child turn itself.
#
# Enabling this is not enough on its own - the planning facet below is what
# actually offers `erato/delegate_task`.
[delegation.tasks]
enabled = true
# `async` too, so the scenario can drive a task whose result is delivered back
# into the origin chat rather than returned inline. `wait` stays first and stays
# the default, so dynamic-tasks.assistants.spec.ts is unaffected: its mock writes
# no `run_mode`.
run_modes = ["wait", "async"]

# A delegated child run carries no provider of its own, so the first entry here
# is what both the origin chat and its delegate talk to; the mock server is the
# only one that answers the scripted delegation turns.
[chat_providers]
priority_order = ["mock-llm-openai"]

[chat_providers.summary]
summary_chat_provider_id = "mock-llm-openai"

[chat_providers.providers.mock-llm-openai]
provider_kind = "openai"
model_name = "placeholder"
model_display_name = "Mock-LLM"
base_url = "http://erato-local-mock-llm-server:44320/base-openai/v1/placeholder"

# The delegate needs a tool of its own, or a delegated run has no nested steps
# to render. No permission rule: with no `mcp_server_permissions.rules` at all,
# every configured server is readable by any logged-in user.
[mcp_servers.mock_mcp_file]
transport_type = "streamable_http"
url = "http://erato-local-mock-mcp-server:44321/mcp/file"

[frontend.additional_environment]
K3D_TEST_SCENARIO = "assistants"

# Restated in full rather than adding `plan` to the base `erato.toml`, which
# reaches every scenario. `web_search` stays FIRST: /me/facets emits
# priority_order before the sorted remainder, and both
# welcome-screen-overrides.assistants.spec.ts and the assistant-facets spec take
# `facets[0]`. Alphabetically `plan` would win that slot.
[facets]
priority_order = ["web_search", "plan"]
default_selected_facets = []

[facets.facets.web_search]
display_name = "Web search"
icon = "iconoir-globe"
tool_call_allowlist = ["web-search-mcp/*", "web-access-mcp/*"]
additional_system_prompt = "Please execute one or multiple web searches to answer the user's question."

# Selecting this facet is what offers `erato/delegate_task`. The reserved
# pattern is paired with a real MCP pattern on purpose: an allowlist naming only
# reserved tools narrows the turn's MCP tool set to nothing, which would leave
# the parent with no tools at all. `mock_mcp_file` is the server this scenario
# configures, and it needs no permission rule (see its comment above).
[facets.facets.plan]
display_name = "Plan & delegate"
icon = "iconoir-strategy"
tool_call_allowlist = ["erato/delegate_task", "mock_mcp_file/*"]
disable_facet_prompt_template = true
