# Main configuration file
# File storage providers are configured in erato.file-storage.auto.erato.toml

# Shortened from the product default because a lease stuck 'running' is
# shared state in this cluster: it fails whichever spec next asserts an idle
# sidebar rather than the one that caused it.
#
# This bounds REAL providers too, not just the mocks — most scenarios chat with
# a live OpenAI or Vertex model. So it is set above the longest wait any spec
# gives a response (`loadingTimeoutMs: 60000`): a turn this fires on is one no
# test is still waiting for, which is what keeps the bound from ever turning a
# passing test red. The mocks are not the binding constraint — their longest
# deliberate silence is 10s (the delayed MCP-approval mock).
#
# This file has the LOWEST precedence of the mounted configs: it is loaded
# first and every `*.auto.erato.toml` overrides it. No scenario sets
# `[generation_status]` today, so this reaches all of them — but one that did
# would silently win.
[generation_status]
provider_idle_timeout_secs = 90

[starter_prompts]
enabled = true
priority_order = ["research_topic", "draft_email", "summarize_notes"]

[starter_prompts.prompts.research_topic]
title = "Research a topic"
subtitle = "Prefill a research request with web search selected"
icon = "iconoir-globe"
prompt = "Research this topic and summarize the most important findings."
selected_facets = ["web_search"]
chat_provider = "mock-llm-200k"

[starter_prompts.prompts.draft_email]
title = "Draft an email"
subtitle = "Write a concise and professional reply"
icon = "iconoir-mail"
prompt = "Draft a concise and professional reply to this email."

[starter_prompts.prompts.summarize_notes]
title = "Summarize notes"
subtitle = "Turn rough notes into a structured summary"
icon = "iconoir-page"
prompt = "Summarize these notes into clear action items and decisions."

[facets]
priority_order = ["web_search"]
default_selected_facets = []

[facets.facets.web_search]
display_name = "Web search"
icon = "iconoir-globe"
tool_call_allowlist = ["web-search-mcp/*", "web-access-mcp/*"]
additional_system_prompt = "Please execute one or multiple web searches to answer the user's question."
