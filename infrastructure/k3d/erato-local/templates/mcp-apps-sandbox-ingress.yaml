{{- if .Values.mcpAppsSandbox.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-mcp-apps-sandbox
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-mcp-apps-sandbox
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.mcpAppsSandbox.host }}
      http:
        paths:
          # The sandbox page only, straight from the backend like the Teams bot
          # webhook: no other page or API of the app answers on this origin.
          - path: /public/common/mcp-apps-sandbox.html
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-erato-app
                port:
                  number: 3130
{{- end }}
