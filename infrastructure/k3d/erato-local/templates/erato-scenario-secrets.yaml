{{/*
Create Kubernetes Secrets for each scenario's generated configuration.
Only creates secrets for scenarios that have .auto.toml files present.
*/}}
{{- if .Values.scenarioSecretsConfig.includeLocalFiles }}
{{- range $scenario := list "basic" "tight-budget" "assistants" "approvals" "entra_id" "many-models" "multi-replica" "nginx-auth" }}
{{- $autoFile := printf "config/erato.scenario-%s.auto.toml" $scenario }}
{{- if $.Files.Glob $autoFile }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-erato-scenario-{{ $scenario | replace "_" "-" }}-secrets
  labels:
    {{- include "erato-local.labels" $ | nindent 4 }}
    app.kubernetes.io/component: config
    erato.dev/scenario: {{ $scenario }}
type: Opaque
stringData:
  erato.scenario.auto.toml: {{ tpl ($.Files.Get $autoFile) $ | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.scenarioSecretsConfig.remoteData }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-erato-scenario-{{ .Values.scenarioSecretsConfig.scenario | replace "_" "-" }}-secrets
  labels:
    {{- include "erato-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
    erato.dev/scenario: {{ .Values.scenarioSecretsConfig.scenario }}
type: Opaque
stringData:
  erato.scenario.auto.toml: {{ .Values.scenarioSecretsConfig.remoteData | quote }}
  scenario-data.toml: {{ .Values.scenarioSecretsConfig.remotePublicData | quote }}
{{- end }}
