{{- if and .Values.nginxAuth.enabled .Values.nginxAuth.embeddedHost.enabled .Values.nginxAuth.embeddedHost.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-embedded-host
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-embedded-host
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if or .Values.nginxAuth.embeddedHost.ingress.annotations (eq .Values.erato.deployment.ingressClassName "tailscale") }}
  annotations:
    {{- with .Values.nginxAuth.embeddedHost.ingress.annotations }}{{ toYaml . | nindent 4 }}{{- end }}
    {{- if eq .Values.erato.deployment.ingressClassName "tailscale" }}
    tailscale.com/tags: {{ .Values.erato.deployment.tailscaleTags | default "tag:k8s-observability" | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if or .Values.erato.deployment.ingressClassName .Values.nginxAuth.embeddedHost.ingress.className }}
  ingressClassName: {{ .Values.erato.deployment.ingressClassName | default .Values.nginxAuth.embeddedHost.ingress.className }}
  {{- end }}
  {{- if .Values.nginxAuth.embeddedHost.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.erato.deployment.embeddedTlsHost | default .Values.nginxAuth.embeddedHost.ingress.host }}
      {{- if or .Values.erato.deployment.tlsSecretName .Values.nginxAuth.embeddedHost.ingress.tls.secretName }}
      secretName: {{ .Values.erato.deployment.tlsSecretName | default .Values.nginxAuth.embeddedHost.ingress.tls.secretName }}
      {{- end }}
  {{- end }}
  rules:
    {{- if ne .Values.erato.deployment.ingressClassName "tailscale" }}
    - host: {{ .Values.erato.deployment.embeddedHost | default .Values.nginxAuth.embeddedHost.ingress.host }}
    {{- else }}
    -
    {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-embedded-host
                port:
                  number: {{ .Values.nginxAuth.embeddedHost.service.port }}
{{- end }}
