[package]
name = "erato_config"
version = "0.6.2"
description = "Shared configuration representation and loading for Erato"
license = "AGPL-3.0-or-later"
edition = "2024"

[dependencies]
base64 = "0.22.1"
config = "0.15.6"
eyre = "0.6.12"
facet = "0.44.3"
regex = "1.12.3"
secrecy = "0.10.3"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tracing = "0.1.41"
utoipa = { version = "5.3.1", features = ["uuid", "chrono"] }
url = "2.5.8"
