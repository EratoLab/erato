[workspace]
resolver = "2"
members = ["erato", "erato_config", "erato-config-schema", "erato_memory", "erato_memory_derive", "mock-llm-server", "mock-mcp-server", "rmcp-sse", "erato_mcp_oauth"]

[workspace.dependencies]
# Local consumers follow the schema crate's own version without a second version constraint.
erato-config-schema = { path = "erato-config-schema" }

[patch.crates-io]
# xberg 1.3.10 can apply transforms twice when scanning large, tagged PDF streams,
# causing visible text to be filtered as off-page. Keep the release plus this fix.
xberg-native-pdf = { git = "https://github.com/EratoLab/xberg.git", rev = "8b75d59e6f6a47ba067aea804f348a5914ccb5b6" }

[profile.dev]
split-debuginfo = "packed"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
xberg-native-pdf.opt-level = 3
html-to-markdown-rs.opt-level = 3
xberg.opt-level = 3

[profile.test.package]
insta.opt-level = 3
similar.opt-level = 3
xberg-native-pdf.opt-level = 3
html-to-markdown-rs.opt-level = 3
xberg.opt-level = 3

[profile.release]
# Preserve qualified names, inline frames and source locations in backtraces
# without generating type and local-variable information for a debugger.
debug = "limited"
# The runtime image ships only the executable; keep its debug information inside it.
split-debuginfo = "off"
