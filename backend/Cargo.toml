[workspace]
resolver = "2"
members = ["erato", "erato_config", "mock-llm-server", "mock-mcp-server", "rmcp-sse", "erato_mcp_oauth"]

[profile.dev]
split-debuginfo = "packed"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
pdf_oxide.opt-level = 3
html-to-markdown-rs.opt-level = 3
xberg.opt-level = 3

[profile.test.package]
insta.opt-level = 3
similar.opt-level = 3
pdf_oxide.opt-level = 3
html-to-markdown-rs.opt-level = 3
xberg.opt-level = 3

[profile.release]
# Preserve qualified names, inline frames and source locations in backtraces
# without generating type and local-variable information for a debugger.
debug = "limited"
# The runtime image ships only the executable; keep its debug information inside it.
split-debuginfo = "off"
