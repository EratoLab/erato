[package]
name = "erato-config-schema"
version = "0.1.0"
description = "Facet-based configuration metadata, reference generation, and validation"
license = "AGPL-3.0-or-later"
edition = "2024"
repository = "https://github.com/EratoLab/erato"
readme = "README.md"
keywords = ["config", "facet", "schema", "documentation"]
categories = ["config", "development-tools"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
eyre = "0.6.12"
facet = "0.44.3"
semver = "1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
