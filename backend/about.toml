# License choices for the backend distribution notice generated by cargo-about.
# Keep this list aligned with the licenses accepted by backend/deny.toml.
accepted = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "MIT-0",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "bzip2-1.0.6",
]

# Only dependencies that are part of the built distribution belong in the notice.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Handle common crates whose published license metadata needs additional help.
workarounds = ["bitvec", "chrono", "prost", "ring", "rustix", "rustls", "sentry", "tonic"]
